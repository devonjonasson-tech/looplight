<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d30"><title>Looplight</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><a class="brand" href="./">✧ Looplight</a><button id="sound" aria-label="Enable sound">Sound off</button></header><section class="intro"><div class="eyebrow">A LITTLE LIGHT. A LITTLE QUIET.</div><h1>Find your flow.</h1><p>Turn the paths. Wake the lanterns.<br>Take as long as you like.</p></section><section class="game" aria-label="Puzzle"><div class="level-heading"><div><span id="level-number" class="eyebrow"></span><h2 id="title"></h2></div><span id="counter"></span></div><div id="board" role="group" aria-label="Rotating light tiles"></div><p id="message" role="status" aria-live="polite"></p><div class="controls"><button id="undo">↶ Undo</button><button id="reset">Reset</button><button id="hint">✧ Hint</button></div><button id="next" class="primary" hidden>Follow the light →</button></section><nav id="levels" aria-label="Choose a puzzle"></nav><footer>No clocks. No rush. Just a little more light.</footer></main><script src="game.js"></script></body></html>
